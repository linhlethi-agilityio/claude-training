name: Claude Code Review

# Reviews pull requests with Claude Code.
# Based on examples/pr-review-comprehensive.yml in anthropics/claude-code-action (v1).
#
# Setup (repo admin, once):
#   1. Install the Claude GitHub App on this repo: https://github.com/apps/claude
#   2. Add the repository secret CLAUDE_CODE_OAUTH_TOKEN
#      (Pro/Max: run `claude setup-token` locally; never paste it into chat or a commit).

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - 'moneylover/**'
      - '.claude/**'
      - '.github/workflows/**'

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, and PRs from forks (they get no secrets).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for the moneylover app (Next.js 16, React 19, Supabase).
            Read CLAUDE.md and follow the team checklist in
            .claude/skills/review-checklist/SKILL.md, in its order:
            correctness, tests, readability, security basics, scope.

            - Put each issue as an inline comment on the exact line, labelled
              Blocker, Should fix or Nit, and say whether it is Verified or Suspected.
            - Check the repo rules: amounts are whole numbers, server actions read the
              user from the session, tests sit in __test__/ next to the code, and one
              ticket per branch.
            - End with one top-level comment: a short summary and a verdict
              (approve / approve with nits / changes requested).
            - Do not push commits or change files. Review only.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
